name: Infrastructure CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/W1-22-ci']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-checks:
    name: Infrastructure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test local setup helper
        run: python3 -B -m unittest discover -s infra/scripts -p test_setup_local.py -v

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Check shell script syntax
        run: sh -n infra/scripts/check-db.sh

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Check required tools
        run: |
          python3 --version
          docker compose version
          docker info --format '{{.ServerVersion}}'
          psql --version

      - name: Test isolated PostgreSQL setup
        run: python3 -u infra/scripts/check-fresh-start.py
